<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barzel Pro - מחשבון ברזל מקצועי</title>

    <meta name="description" content="מחשבון ברזל מקצועי לאתר בניה - חישוב משקלים ואורכים של ברזל בניה">

    <!-- Fonts: Inter (English), Heebo (Hebrew), JetBrains Mono (Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap"
        rel="stylesheet">

    <!-- React, ReactDOM, Babel, Tailwind, Lucide -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Heebo', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        'safety-orange': '#FF4500',
                        'off-white': '#F4F4F5',
                        'ink-black': '#121212',
                    },
                    boxShadow: {
                        'brutal': '4px 4px 0px 0px #121212',
                        'brutal-sm': '2px 2px 0px 0px #121212',
                    },
                    borderWidth: {
                        '3': '3px',
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Heebo', sans-serif;
            background-color: #F4F4F5;
            touch-action: manipulation;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .bg-grid {
            background-size: 20px 20px;
            background-image: linear-gradient(to left, #e4e4e7 1px, transparent 1px), linear-gradient(to bottom, #e4e4e7 1px, transparent 1px);
        }
    </style>
</head>

<body class="bg-off-white bg-grid h-screen overflow-hidden flex flex-col items-center">

    <div id="root" class="w-full h-full max-w-lg mx-auto flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONSTANTS ---
        const WEIGHTS = { 8: 0.395, 10: 0.617, 12: 0.888, 14: 1.21, 16: 1.58, 18: 2.00, 20: 2.47, 22: 2.98, 25: 3.85 };
        const DIAMETERS = [8, 10, 12, 14, 16, 18, 20, 22, 25];
        const TYPES = ["מוטות אורך", "ברזל עליון", "ברזל תחתון", "חישוקים", "רשת", "ח"];

        // Color Coding
        const DIA_CLASSES = {
            8: 'bg-yellow-100 text-yellow-900 border-yellow-500',
            10: 'bg-indigo-100 text-indigo-900 border-indigo-500',
            12: 'bg-red-100 text-red-900 border-red-500',
            14: 'bg-emerald-100 text-emerald-900 border-emerald-500',
            16: 'bg-blue-100 text-blue-900 border-blue-500',
            18: 'bg-orange-100 text-orange-900 border-orange-500',
            20: 'bg-stone-200 text-stone-900 border-stone-600',
            22: 'bg-teal-100 text-teal-900 border-teal-500',
            25: 'bg-pink-100 text-pink-900 border-pink-500',
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const HelpLabel = ({ label, text }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="flex flex-col mb-1.5">
                    <div onClick={() => setIsOpen(!isOpen)} className="flex justify-between items-center cursor-pointer select-none group">
                        <span className="text-sm font-bold text-ink-black uppercase tracking-wide">{label}</span>
                        <span className={`text-[10px] w-5 h-5 flex items-center justify-center border-2 border-slate-300 group-hover:border-ink-black ${isOpen ? 'bg-slate-200' : 'bg-white'}`}>?</span>
                    </div>
                    <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-24 mt-1 border-r-3 border-safety-orange pr-2' : 'max-h-0'}`}>
                        <p className="text-xs font-mono text-slate-600 bg-white border border-slate-200 p-2">{text}</p>
                    </div>
                </div>
            );
        };

        const handleEnterKey = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const form = e.target.form;
                const index = Array.prototype.indexOf.call(form, e.target);
                const nextElement = form.elements[index + 1];
                if (nextElement) {
                    nextElement.focus();
                }
            }
        };

        const InputField = ({ value, onChange, placeholder, type = "text", inputMode = "text", list }) => (
            <input
                type={type} inputMode={inputMode} value={value} onChange={onChange} placeholder={placeholder} list={list}
                onKeyDown={handleEnterKey}
                className="w-full h-12 px-3 bg-white border-3 border-ink-black text-lg font-mono font-bold text-ink-black placeholder-slate-400 focus:outline-none focus:border-safety-orange transition-colors shadow-brutal-sm focus:-translate-x-[1px] focus:translate-y-[1px] focus:shadow-none mb-1"
            />
        );

        const SelectField = ({ value, onChange, options }) => (
            <div className="relative">
                <select value={value} onChange={onChange} onKeyDown={handleEnterKey} className="w-full h-12 px-3 bg-white border-3 border-ink-black text-lg font-sans font-bold text-ink-black appearance-none focus:outline-none focus:border-safety-orange shadow-brutal-sm focus:-translate-x-[1px] focus:translate-y-[1px] focus:shadow-none mb-1">
                    <option value="" disabled>בחר סוג...</option>
                    {options.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
                <div className="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-ink-black"><Icon name="chevron-down" size={16} /></div>
            </div>
        );

        const CalculatorApp = () => {
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('barzel_pro_v3_items');
                return saved ? JSON.parse(saved) : [];
            });
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('barzel_pro_history');
                return saved ? JSON.parse(saved) : ["חגורה", "עמוד", "קורה", "רצפה"];
            });

            // Fields
            const [name, setName] = useState("");
            const [ironType, setIronType] = useState(TYPES[0]);
            const [dia, setDia] = useState(12);
            const [length, setLength] = useState("");
            const [qtySec, setQtySec] = useState("");
            const [count, setCount] = useState("1");
            const [activeTab, setActiveTab] = useState("weight");

            useEffect(() => {
                localStorage.setItem('barzel_pro_v3_items', JSON.stringify(items));
                localStorage.setItem('barzel_pro_history', JSON.stringify(history));
            }, [items, history]);

            const haptic = () => { if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(15); };

            const handleAdd = () => {
                if (!length || !qtySec || !count) return;
                const nLen = parseFloat(length), nQty = parseFloat(qtySec), nCnt = parseFloat(count);
                if (isNaN(nLen) || isNaN(nQty) || isNaN(nCnt)) return;

                haptic();

                // Add name to history if unique and not empty
                if (name && !history.includes(name)) {
                    setHistory(prev => [name, ...prev].slice(0, 50));
                }

                const newItem = {
                    id: Date.now(),
                    name: name || "ללא שם",
                    type: ironType,
                    dia, length: nLen, qtySec: nQty, count: nCnt
                };
                setItems([newItem, ...items]);
                setLength(""); setQtySec(""); setCount("1");
            };

            const handleDelete = (id) => setItems(prev => prev.filter(i => i.id !== id));

            const handleExport = () => {
                const BOM = "\uFEFF";
                const headers = ["שם", "סוג", "קוטר", "אורך", "כמות", "ספירה", "משקל"];
                const rows = items.map(i => {
                    const w = (i.length * i.qtySec * i.count * (WEIGHTS[i.dia] || 0)).toFixed(2);
                    return [`"${i.name}"`, `"${i.type}"`, i.dia, i.length, i.qtySec, i.count, w].join(",");
                });
                const blob = new Blob([BOM + headers.join(",") + "\n" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `BarzelPro_${Date.now()}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleClearAll = () => {
                if (items.length === 0) return;
                if (window.confirm("האם למחוק את כל הפריטים?")) {
                    setItems([]);
                    haptic();
                }
            };

            const stats = useMemo(() => {
                const grp = {};
                let totalW = 0;
                items.forEach(i => {
                    const w = i.length * i.qtySec * i.count * (WEIGHTS[i.dia] || 0);
                    const l = i.length * i.qtySec * i.count;
                    totalW += w;
                    if (!grp[i.dia]) grp[i.dia] = { weight: 0, length: 0 };
                    grp[i.dia].weight += w;
                    grp[i.dia].length += l;
                });
                return { grp, totalW };
            }, [items]);

            return (
                <div className="flex flex-col h-full bg-off-white">
                    {/* Header */}
                    <header className="bg-ink-black text-white p-4 border-b-4 border-safety-orange flex justify-between items-center z-20 shrink-0">

                        {/* Right Side: Action Buttons */}
                        <div className="flex items-center gap-2">
                            {items.length > 0 && (
                                <>
                                    <button onClick={handleExport} className="text-white hover:text-safety-orange transition-colors flex items-center gap-1 bg-white/10 px-3 py-2 rounded-sm border border-white/20 hover:border-safety-orange">
                                        <Icon name="download" size={18} />
                                    </button>
                                    <button onClick={handleClearAll} className="text-white hover:text-red-500 transition-colors flex items-center gap-1 bg-white/10 px-3 py-2 rounded-sm border border-white/20 hover:border-red-500">
                                        <Icon name="trash-2" size={18} />
                                    </button>
                                </>
                            )}
                        </div>

                        {/* Left Side: Branding */}
                        <div>
                            <h1 className="text-3xl font-black tracking-tighter leading-none flex flex-row-reverse gap-1">
                                BARZEL<span className="text-safety-orange">PRO</span>
                            </h1>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4">

                        {/* INPUTS - Wrapped in Form for Navigation */}
                        <form className="bg-white border-3 border-ink-black shadow-brutal p-5 space-y-4" onSubmit={(e) => { e.preventDefault(); }}>

                            {/* Row 1: Name & Type */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <HelpLabel label="שם האלמנט" text="הקלד שם או בחר מההיסטוריה." />
                                    <InputField value={name} onChange={e => setName(e.target.value)} list="name-history" placeholder="" />
                                    <datalist id="name-history">
                                        {history.map((h, i) => <option key={i} value={h} />)}
                                    </datalist>
                                </div>
                                <div>
                                    <HelpLabel label="סוג ברזל" text="בחר את סוג הברזל." />
                                    <SelectField value={ironType} onChange={e => setIronType(e.target.value)} options={TYPES} />
                                </div>
                            </div>

                            {/* Row 2: Diameter */}
                            <div>
                                <HelpLabel label="קוטר" text="בחר קוטר." />
                                <div className="grid grid-cols-5 gap-1.5">
                                    {DIAMETERS.map(d => (
                                        <button key={d} onClick={() => setDia(d)} type="button"
                                            className={`h-10 font-mono font-bold text-sm border-2 transition-all
                                            ${dia === d ? 'bg-ink-black text-white border-ink-black -translate-x-[1px] translate-y-[1px]' : 'bg-white text-ink-black border-slate-300 shadow-brutal-sm hover:shadow-none hover:-translate-x-[2px] hover:translate-y-[2px]'}`}
                                        >
                                            {d}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Row 3: Dims */}
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <HelpLabel label="אורך" text="אורך מוט בודד." />
                                    <InputField value={length} onChange={e => setLength(e.target.value)} placeholder="0.00" inputMode="decimal" type="number" />
                                </div>
                                <div>
                                    <HelpLabel label="כמות בחתך" text="מספר מוטים באלמנט." />
                                    <InputField value={qtySec} onChange={e => setQtySec(e.target.value)} placeholder="0" inputMode="decimal" type="number" />
                                </div>
                            </div>

                            {/* Row 4: Multiplier & Add */}
                            <div className="flex gap-4 items-end">
                                <div className="flex-1">
                                    <HelpLabel label="חזרות" text="מספר אלמנטים זהים." />
                                    <div className="flex">
                                        <button type="button" className="w-12 h-12 border-3 border-l-0 border-ink-black bg-slate-100 font-bold text-xl hover:bg-slate-200" onClick={() => setCount(c => Math.max(1, (parseFloat(c) || 0) - 1).toString())}>-</button>
                                        <input className="w-full h-12 border-3 border-ink-black text-center font-mono font-bold text-lg focus:outline-none z-10" value={count} onKeyDown={handleEnterKey} onChange={e => setCount(e.target.value)} type="number" inputMode="decimal" placeholder="1" />
                                        <button type="button" className="w-12 h-12 border-3 border-r-0 border-ink-black bg-slate-100 font-bold text-xl hover:bg-slate-200" onClick={() => setCount(c => ((parseFloat(c) || 0) + 1).toString())}>+</button>
                                    </div>
                                </div>
                                <div className="flex-1">
                                    <button type="button" onClick={handleAdd} disabled={!length || !qtySec || !count} className="w-full h-12 bg-safety-orange border-3 border-ink-black shadow-brutal active:shadow-none active:translate-x-[4px] active:translate-y-[4px] disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2 text-white font-black text-lg uppercase tracking-wider">
                                        הוסף <Icon name="plus" size={22} className="stroke-[3px]" />
                                    </button>
                                </div>
                            </div>
                        </form>

                        {/* MONITOR */}
                        <section className="bg-ink-black border-3 border-ink-black p-4 text-white shadow-brutal relative overflow-hidden">
                            <div className="flex justify-between items-end mb-6 relative z-10">
                                <div>
                                    <div className="text-safety-orange font-mono text-xs tracking-widest mb-1">סה״כ לפרויקט</div>
                                    <div className="text-5xl font-mono font-black tracking-tight">{stats.totalW.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} <span className="text-lg opacity-50 mr-2">kg</span></div>
                                </div>
                                <div className="flex bg-white/10 p-1 border border-white/20">
                                    <button onClick={() => setActiveTab('weight')} className={`px-2 py-1 text-[10px] font-bold uppercase ${activeTab === 'weight' ? 'bg-safety-orange text-white' : 'text-white/50'}`}>משקל</button>
                                    <button onClick={() => setActiveTab('length')} className={`px-2 py-1 text-[10px] font-bold uppercase ${activeTab === 'length' ? 'bg-safety-orange text-white' : 'text-white/50'}`}>אורך</button>
                                </div>
                            </div>
                            <div className="space-y-2 relative z-10">
                                {DIAMETERS.filter(d => stats.grp[d]).map(d => {
                                    const val = activeTab === 'weight' ? stats.grp[d].weight : stats.grp[d].length;
                                    const max = Math.max(1, ...Object.values(stats.grp).map(g => activeTab === 'weight' ? g.weight : g.length));
                                    return (
                                        <div key={d} className="flex items-center gap-3 font-mono text-xs">
                                            <div className={`w-8 h-5 flex items-center justify-center font-bold text-[10px] text-ink-black border border-ink-black ${DIA_CLASSES[d].split(' ')[0]}`}>{d}</div>
                                            <div className="flex-1 h-3 bg-white/10 border border-white/20 p-[1px]"><div style={{ width: `${(val / max) * 100}%` }} className="h-full bg-safety-orange"></div></div>
                                            <div className="w-16 text-left font-bold">{val.toFixed(1)}</div>
                                        </div>
                                    )
                                })}
                            </div>
                        </section>

                        {/* TABLE LOG */}
                        <section className="pb-6">
                            <div className="flex items-center gap-2 mb-2">
                                <div className="h-2 w-2 bg-ink-black"></div>
                                <h3 className="font-bold text-sm tracking-widest uppercase">טבלת סיכום</h3>
                            </div>

                            <div className="overflow-x-auto border-3 border-ink-black shadow-brutal bg-white">
                                <table className="w-full text-sm text-right">
                                    <thead className="bg-ink-black text-white font-bold uppercase text-xs">
                                        <tr>
                                            <th className="px-3 py-2 whitespace-nowrap">שם</th>
                                            <th className="px-3 py-2 whitespace-nowrap">סוג</th>
                                            <th className="px-3 py-2 text-center">קוטר</th>
                                            <th className="px-3 py-2 text-center">אורך</th>
                                            <th className="px-3 py-2 text-center">מס׳</th>
                                            <th className="px-3 py-2 text-left">משקל</th>
                                            <th className="px-2 py-2"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y-2 divide-slate-100">
                                        {items.map(item => {
                                            const w = (item.length * item.qtySec * item.count * (WEIGHTS[item.dia] || 0));
                                            return (
                                                <tr key={item.id} className="hover:bg-slate-50 group transition-colors">
                                                    <td className="px-3 py-2 font-bold text-ink-black max-w-[100px] truncate">{item.name}</td>
                                                    <td className="px-3 py-2 text-slate-500 text-xs">{item.type}</td>
                                                    <td className="px-3 py-2 text-center font-mono text-xs">
                                                        <span className={`px-1.5 py-0.5 border ${DIA_CLASSES[item.dia].split(' ')[0]} ${DIA_CLASSES[item.dia].split(' ')[1]} ${DIA_CLASSES[item.dia].split(' ')[2]}`}>⌀{item.dia}</span>
                                                    </td>
                                                    <td className="px-3 py-2 text-center font-mono">{item.length}</td>
                                                    <td className="px-3 py-2 text-center font-mono text-xs">{item.qtySec}x{item.count}</td>
                                                    <td className="px-3 py-2 text-left font-mono font-bold text-ink-black">{w.toFixed(1)}</td>
                                                    <td className="px-2 py-2 text-center">
                                                        <button onClick={() => handleDelete(item.id)} className="text-slate-300 hover:text-red-600 transition-colors">
                                                            <Icon name="x" size={16} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                        {items.length === 0 && (
                                            <tr><td colSpan="7" className="text-center py-8 text-slate-400 font-mono text-xs">הטבלה ריקה</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </main>

                    {/* FOOTER */}
                    <footer className="bg-off-white text-center py-4 text-base text-slate-600 font-sans tracking-wide">
                        Made with ❤️ by <span className="font-black text-ink-black text-lg tracking-wider">ELIYA SAGRON</span>
                    </footer>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CalculatorApp />);

        // Initialize Lucide icons
        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);
    </script>
</body>

</html>
